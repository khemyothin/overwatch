<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERWATCH: TACTICAL COMMAND v2.0</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-red: #ff003c;
            --neon-green: #39ff14;
            --bg-dark: #050507;
            --panel-bg: rgba(13, 13, 15, 0.9);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #d1d1d6;
            margin: 0;
            overflow: hidden;
        }

        .font-tech {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
        }

        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }

        #map {
            height: 100vh;
            width: 100vw;
            background: #000;
        }

        /* --- CRT & Scanline VFX --- */
        .crt-overlay::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 1000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 1001;
            background: linear-gradient(0deg, rgba(0, 242, 255, 0) 0%, rgba(0, 242, 255, 0.03) 50%, rgba(0, 242, 255, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            100% {
                bottom: -100px;
            }
        }

        /* --- Custom Markers --- */
        .leaflet-div-icon {
            background: none !important;
            border: none !important;
        }

        .marker-base {
            border-radius: 50%;
            border: 2px solid #fff;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .marker-base {
            border-radius: 50%;
            border: 2px solid #fff;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pulse-marker-inner {
            width: 22px;
            height: 22px;
            background: var(--neon-red);
            border-radius: 50%;
            border: 2px solid #fff;
            animation: pulse-red 0.8s infinite cubic-bezier(0.66, 0, 0, 1);
            box-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red);
            box-sizing: border-box;
        }

        .standard-marker-inner {
            width: 14px;
            height: 14px;
            background: var(--neon-cyan);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px var(--neon-cyan);
            box-sizing: border-box;
        }

        .hq-marker {
            width: 18px;
            height: 18px;
            background: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            border: 3px solid #000;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.8);
            }

            70% {
                transform: scale(1.3);
                box-shadow: 0 0 0 15px rgba(255, 0, 60, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 0, 60, 0);
            }
        }

        /* --- Dashboard Elements --- */
        .sidebar {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid #222;
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .cyber-panel {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid #333;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .neon-text-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .neon-text-red {
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }

        /* --- Emergency Override --- */
        .emergency-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff003c 20%, #4a0011 100%);
            border: 6px solid #fff;
            color: #fff;
            z-index: 5000;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .emergency-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.8);
        }

        .emergency-btn:active {
            transform: scale(0.9);
            background: #fff;
            color: #ff003c;
        }

        .emergency-btn.active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 60px var(--neon-cyan);
            border-color: #000;
            animation: btn-shake 0.1s infinite;
        }

        @keyframes btn-shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        #alert-banner {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 60, 0.95);
            color: #fff;
            padding: 15px 60px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5em;
            z-index: 9000;
            border: 2px solid #fff;
            box-shadow: 0 0 40px #ff003c;
            display: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            animation: banner-slide 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes banner-slide {
            from {
                top: -100px;
                opacity: 0;
            }

            to {
                top: 40px;
                opacity: 1;
            }
        }

        .emergency-filter {
            filter: contrast(180%) brightness(140%) saturate(200%) hue-rotate(-15deg) !important;
            transition: filter 0.5s ease;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }
    </style>
</head>

<body class="h-screen flex crt-overlay">
    <div class="scanline"></div>

    <!-- Sidebar Control Panel -->
    <aside class="sidebar border-r border-gray-800">
        <div class="p-8 border-b border-gray-800">
            <div class="flex justify-between items-start mb-4">
                <h1 class="text-3xl font-bold font-tech neon-text-cyan flex flex-col">
                    <span>OVERWATCH</span>
                    <span class="text-[10px] tracking-[0.6em] text-gray-500 -mt-1">COMMAND SYSTEM</span>
                </h1>
                <div class="px-2 py-1 border border-cyan-500/30 bg-cyan-950/20 text-[8px] font-mono text-cyan-400">
                    v2.0.42_A</div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-6">
                <div class="p-2 cyber-panel">
                    <div class="text-[8px] text-gray-500 font-tech">SATLINK STATUS</div>
                    <div id="status-text" class="text-[10px] text-green-400 font-tech uppercase">Syncing...</div>
                </div>
                <div class="p-2 cyber-panel">
                    <div class="text-[8px] text-gray-500 font-tech">LATENCY</div>
                    <div id="latency-text" class="text-[10px] text-cyan-400 font-mono">14ms</div>
                </div>
            </div>
        </div>

        <!-- Incident Stream -->
        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="stream-container">
            <div class="flex items-center space-x-2 text-[10px] font-tech text-gray-600 mb-2">
                <div class="w-1.5 h-1.5 bg-gray-700 animate-pulse"></div>
                <span>REAL-TIME TELEMETRY FEED</span>
            </div>
            <!-- Logs will appear here -->
            <div id="initial-load" class="text-[10px] font-mono text-gray-500 animate-pulse">
                INITIALIZING NEURAL LINK...<br>
                ESTABLISHING SECURE HANDSHAKE...<br>
                SCANNING LOCAL GRID...
            </div>
        </div>

        <!-- Footer Info -->
        <div class="p-6 bg-black border-t border-gray-800">
            <div class="flex justify-between text-[9px] font-tech text-gray-600">
                <span>COORD: <span id="mouse-coords">0.000, 0.000</span></span>
                <span id="sys-clock">00:00:00</span>
            </div>
        </div>
    </aside>

    <!-- Main Map View -->
    <main class="flex-1 relative">
        <div id="map"></div>

        <!-- EMERGENCY UI -->
        <div id="alert-banner" class="font-tech">TRAFFIC CONTROL ACTIVE</div>

        <button id="override-btn" class="emergency-btn font-tech" onclick="toggleEmergency()">
            <span class="text-[8px]">Protocol</span>
            <span class="text-lg leading-tight mt-1">Override</span>
            <div class="mt-2 w-8 h-1 bg-white/30 rounded-full overflow-hidden">
                <div class="h-full bg-white transition-all duration-300" style="width: 100%"></div>
            </div>
        </button>

        <!-- Right Side HUD (System Info) -->
        <div class="absolute top-6 right-6 z-[2000] w-64 space-y-4 pointer-events-none">
            <div class="p-4 cyber-panel backdrop-blur-md border-cyan-500/20">
                <div class="text-[8px] text-gray-500 font-tech mb-2">SYSTEM SCANNER</div>
                <div class="space-y-2">
                    <div class="flex justify-between text-[10px]">
                        <span class="text-gray-500">THREATS:</span>
                        <span id="threat-count" class="text-cyan-400 font-mono">00</span>
                    </div>
                    <div class="flex justify-between text-[10px]">
                        <span class="text-gray-500">CPU LOAD:</span>
                        <span class="text-green-500 font-mono">12.4%</span>
                    </div>
                    <div id="override-status-hud" class="hidden flex justify-between text-[10px] animate-pulse">
                        <span class="text-red-500">OVERRIDE:</span>
                        <span class="text-red-500 font-tech">ACTIVE</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CONFIG
        const SOCKET_URL = 'http://127.0.0.1:3001';
        const HQ_COORDS = [13.7456, 100.5341];

        // APP STATE
        let incidents = [];
        let latestIncident = null;
        let isEmergency = false;
        let rescuePath = null;
        let hqMarker = null;

        // INIT MAP
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([13.7563, 100.5018], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // UI Handlers
        const stream = document.getElementById('stream-container');
        const clock = document.getElementById('sys-clock');
        const mouseCoords = document.getElementById('mouse-coords');
        const threatCount = document.getElementById('threat-count');

        setInterval(() => {
            clock.textContent = new Date().toTimeString().split(' ')[0];
        }, 1000);

        map.on('mousemove', (e) => {
            mouseCoords.textContent = `${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)}`;
        });

        // Add HQ Marker
        hqMarker = L.marker(HQ_COORDS, {
            icon: L.divIcon({
                className: 'hq-marker marker-base',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            })
        }).addTo(map).bindPopup('<div class="font-tech text-green-500 text-[10px]">SIAM COMMAND CENTER</div>', { closeButton: false });

        // SOCKET CONNECTION
        const socket = io(SOCKET_URL);

        socket.on('connect', () => {
            document.getElementById('status-text').textContent = 'LINK STABLE';
            document.getElementById('status-text').className = 'text-[10px] text-green-400 font-tech uppercase';
            console.log("Satlink established.");
        });

        socket.on('disconnect', () => {
            document.getElementById('status-text').textContent = 'SIGNAL LOST';
            document.getElementById('status-text').className = 'text-[10px] text-red-500 font-tech uppercase';
        });

        socket.on('new_incident', (data) => {
            incidents.push(data);
            latestIncident = data;
            threatCount.textContent = incidents.length.toString().padStart(2, '0');

            addMarkerToMap(data);
            addLogToStream(data);

            if (isEmergency) {
                drawRescuePath();
            }
        });

        function addMarkerToMap(inc) {
            const isHigh = inc.priority === 'HIGH';

            // Jitter logic: add small offset to prevent stacking
            const jitterLat = (Math.random() - 0.5) * 0.001;
            const jitterLng = (Math.random() - 0.5) * 0.001;
            const lat = inc.latitude + jitterLat;
            const lng = inc.longitude + jitterLng;

            const iconSize = isHigh ? [22, 22] : [14, 14];
            const icon = L.divIcon({
                className: `marker-container`,
                html: `<div class="${isHigh ? 'pulse-marker-inner' : 'standard-marker-inner'}"></div>`,
                iconSize: iconSize,
                iconAnchor: [iconSize[0] / 2, iconSize[1] / 2]
            });

            const m = L.marker([lat, lng], { icon }).addTo(map);
            m.bindPopup(`
                <div class="p-2 font-mono text-[10px]">
                    <div class="flex justify-between border-b border-gray-800 pb-1 mb-1">
                        <span class="${isHigh ? 'text-red-500' : 'text-cyan-400'}">ID: ${inc.id.slice(0, 8)}</span>
                        <span class="text-gray-500">${inc.priority}</span>
                    </div>
                    <div class="text-white mt-1 uppercase">${inc.type}: ${inc.text}</div>
                    <div class="text-gray-600 mt-2 text-[8px]">GPS: ${inc.latitude.toFixed(4)}, ${inc.longitude.toFixed(4)}</div>
                </div>
            `, { closeButton: false });
        }

        function addLogToStream(inc) {
            document.getElementById('initial-load')?.remove();

            const isHigh = inc.priority === 'HIGH';
            const log = document.createElement('div');
            log.className = `p-4 cyber-panel border-l-4 transition-all hover:bg-white/5 cursor-pointer ${isHigh ? 'border-red-600 bg-red-950/10' : 'border-cyan-600'}`;
            log.onclick = () => map.flyTo([inc.latitude, inc.longitude], 15);

            log.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[9px] font-tech ${isHigh ? 'neon-text-red' : 'neon-text-cyan'}">${inc.type}</span>
                    <span class="text-[8px] font-mono text-gray-500">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="text-xs text-gray-300 leading-tight">${inc.text}</div>
                <div class="mt-2 text-[8px] font-mono text-gray-600 flex justify-between">
                    <span>SECTOR: BKK-G12</span>
                    <span>THREAT LEVEL: ${isHigh ? 'CRITICAL' : 'MINIMAL'}</span>
                </div>
            `;
            stream.prepend(log);
        }

        // EMERGENCY LOGIC
        function toggleEmergency() {
            const btn = document.getElementById('override-btn');
            const banner = document.getElementById('alert-banner');
            const hud = document.getElementById('override-status-hud');

            isEmergency = !isEmergency;

            if (isEmergency) {
                btn.classList.add('active');
                banner.style.display = 'block';
                hud.classList.remove('hidden');
                document.body.classList.add('emergency-filter');
                drawRescuePath();
                console.warn("PROTOCOL OVERRIDE: TRAFFIC CONTROL ACTIVE");
            } else {
                btn.classList.remove('active');
                banner.style.display = 'none';
                hud.classList.add('hidden');
                document.body.classList.remove('emergency-filter');
                if (rescuePath) map.removeLayer(rescuePath);
                rescuePath = null;
            }
        }

        function drawRescuePath() {
            if (!latestIncident) return;
            if (rescuePath) map.removeLayer(rescuePath);

            const points = [HQ_COORDS, [latestIncident.latitude, latestIncident.longitude]];

            rescuePath = L.polyline(points, {
                color: '#39ff14',
                weight: 6,
                opacity: 0.8,
                lineCap: 'round',
                className: 'neon-path-line'
            }).addTo(map);

            // Add CSS animation filter to path
            setTimeout(() => {
                const pathEl = rescuePath.getElement();
                if (pathEl) {
                    pathEl.style.filter = 'drop-shadow(0 0 10px #39ff14)';
                    pathEl.style.strokeDasharray = '10, 15';
                    pathEl.animate([
                        { strokeDashoffset: '100' },
                        { strokeDashoffset: '0' }
                    ], { duration: 1000, iterations: Infinity });
                }
            }, 100);

            map.fitBounds(rescuePath.getBounds(), { padding: [100, 100], duration: 1.5 });
        }
    </script>
</body>

</html>
